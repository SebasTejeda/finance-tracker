version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: finance-tracker-db
    environment:
      POSTGRES_USER: finance_user
      POSTGRES_PASSWORD: finance_password
      POSTGRES_DB: finance_tracker_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - finance-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finance_user -d finance_tracker_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # pgAdmin (Opcional - Interfaz gráfica para PostgreSQL)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: finance-tracker-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@finance.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - finance-network
    restart: unless-stopped

volumes:
  postgres_data:
  pgadmin_data:

networks:
  finance-network:
    driver: bridge